name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android source project
        run: |
          unzip -q NornsPocket_Android_v0.3-alpha.zip
          test -f NornsPocket_Android/settings.gradle
          test -f NornsPocket_Android/app/build.gradle

      - name: Apply Java source compatibility fix
        run: patch -d NornsPocket_Android -p1 < patches/0001-fix-osc-lambda-variable.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build debug APK
        working-directory: NornsPocket_Android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NornsPocket-debug-apk
          path: NornsPocket_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
